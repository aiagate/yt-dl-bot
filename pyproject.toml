[project]
name = "yt-dl-bot"
version = "0.1.0"
description = "Discord bot for downloading and processing YouTube videos and chats"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "discord.py>=2.4.0",
    "ffmpeg-python>=0.2.0",
    "japanize-matplotlib>=1.1.3",
    "matplotlib>=3.9.2",
    "pydantic-settings>=2.4.0",
    "pytchat>=0.5.5",
    "requests>=2.33.0",
    "yt-dlp>=2026.7.4",
]

[project.scripts]
yt-dl-bot = "yt_dl_bot.discord_bot_main:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage[toml]>=7.10.0",
    "mypy>=1.17.0",
    "pip-audit>=2.10.1",
    "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "ARG", "B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
# Discord.py requires callback parameters that are not always consumed by the
# implementation.
"src/yt_dl_bot/cogs/systemcog.py" = ["ARG002"]
# Full-width punctuation is intentional in sanitized filenames and their fixtures.
"src/yt_dl_bot/download_engine.py" = ["RUF001"]
"tests/test_download_engine.py" = ["RUF001"]
"tests/test_download_services.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
files = [
    "src/yt_dl_bot/application_errors.py",
    "src/yt_dl_bot/application_container.py",
    "src/yt_dl_bot/application_results.py",
    "src/yt_dl_bot/artifact_discovery.py",
    "src/yt_dl_bot/artifact_store.py",
    "src/yt_dl_bot/cancellation.py",
    "src/yt_dl_bot/chat_highlights.py",
    "src/yt_dl_bot/download_engine.py",
    "src/yt_dl_bot/download_service.py",
    "src/yt_dl_bot/error_reporting.py",
    "src/yt_dl_bot/external_error_adapter.py",
    "src/yt_dl_bot/message_router.py",
    "src/yt_dl_bot/url_validation.py",
    "src/yt_dl_bot/video_download_service.py",
    "src/yt_dl_bot/youtube_highlight_service.py",
]
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["yt_dl_bot"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
