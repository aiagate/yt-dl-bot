[project]
name = "yt-dl-bot"
version = "0.1.0"
description = "Discord bot for downloading and processing YouTube videos and chats"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "discord.py>=2.4.0",
    "ffmpeg-python>=0.2.0",
    "japanize-matplotlib>=1.1.3",
    "matplotlib>=3.9.2",
    "pydantic-settings>=2.4.0",
    "pytchat>=0.5.5",
    "requests>=2.33.0",
    "yt-dlp>=2026.7.4",
]

[project.scripts]
yt-dl-bot = "yt_dl_bot.discord_bot_main:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage[toml]>=7.10.0",
    "mypy>=1.17.0",
    "pip-audit>=2.10.1",
    "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "ARG", "B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
# Discord.py requires callback parameters that are not always consumed by the
# implementation.
"src/yt_dl_bot/cogs/systemcog.py" = ["ARG002"]
# Full-width punctuation is intentional in sanitized filenames and their fixtures.
"src/yt_dl_bot/download_engine.py" = ["RUF001"]
"tests/download_adapter_test_support.py" = ["RUF001"]
"tests/test_download_engine.py" = ["RUF001"]
"tests/test_youtube_downloader.py" = ["RUF001"]
"tests/test_yt_dlp_downloader.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
files = ["src/yt_dl_bot"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
ignore_missing_imports = false
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# These runtime dependencies do not publish complete PEP 561 type information.
module = ["pytchat", "pytchat.*", "yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["yt_dl_bot"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
