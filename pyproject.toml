[project]
name = "yt-dl-bot"
version = "0.1.0"
description = "Discord bot for downloading and processing YouTube videos and chats"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "discord.py>=2.4.0",
    "ffmpeg-python>=0.2.0",
    "japanize-matplotlib>=1.1.3",
    "matplotlib>=3.9.2",
    "pydantic-settings>=2.4.0",
    "pytchat>=0.5.5",
    "requests>=2.33.0",
    "yt-dlp>=2026.7.4",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
]

[tool.uv]
package = false
